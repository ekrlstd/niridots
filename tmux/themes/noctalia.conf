# Generated by Noctalia

# Palette
set -gq @noctalia_surface "#131314"
set -gq @noctalia_on_surface "#e4e2e3"
set -gq @noctalia_surface_container_low "#1b1b1d"
set -gq @noctalia_surface_container "#1f1f21"
set -gq @noctalia_surface_container_high "#2a2a2b"
set -gq @noctalia_surface_container_highest "#353536"
set -gq @noctalia_on_surface_variant "#c5c6cc"
set -gq @noctalia_outline "#8f9096"
set -gq @noctalia_outline_variant "#45474c"
set -gq @noctalia_primary "#bfc7d9"
set -gq @noctalia_on_primary "#29313f"
set -gq @noctalia_primary_container "#010612"
set -gq @noctalia_on_primary_container "#707888"
set -gq @noctalia_secondary_container "#464950"
set -gq @noctalia_on_secondary_container "#b6b8c0"
set -gq @noctalia_tertiary_container "#090410"
set -gq @noctalia_on_tertiary_container "#7e7486"
set -gq @noctalia_error_container "#93000a"
set -gq @noctalia_on_error_container "#ffdad6"

# Styles
set -gqF status-style "bg=#{@noctalia_surface_container_low},fg=#{@noctalia_on_surface}"
if-shell -F '#{==:#{@noctalia_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@noctalia_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface},bold"
set -gqF window-status-last-style "fg=#{@noctalia_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@noctalia_error_container},fg=#{@noctalia_on_error_container},bold"
set -gqF pane-border-style "fg=#{@noctalia_outline_variant}"
set -gqF pane-active-border-style "fg=#{@noctalia_primary}"
set -gqF mode-style "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container},bold"
set -gqF message-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF message-command-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF popup-style "bg=#{@noctalia_surface},fg=#{@noctalia_on_surface}"
set -gqF popup-border-style "fg=#{@noctalia_outline}"
set -gqF menu-style "bg=#{@noctalia_surface_container_high},fg=#{@noctalia_on_surface}"
set -gqF menu-selected-style "bg=#{@noctalia_primary},fg=#{@noctalia_on_primary},bold"
set -gqF menu-border-style "fg=#{@noctalia_outline}"
set -gqF copy-mode-match-style "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container}"
set -gqF clock-mode-colour "#{@noctalia_primary}"
